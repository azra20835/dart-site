<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Dart Oyunu</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #f0f0f0;
    }
    .dart {
      width: 300px;
      height: 300px;
      background: red;
      border-radius: 50%;
      margin: 30px auto;
      position: relative;
      cursor: pointer;
    }
    .center {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 90px;
      left: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body>

<h1>Puan: <span id="puan">0</span></h1>

<div class="dart" onclick="puanArttir()">
  <div class="center">
    <img src="kopek.jpg">
  </div>
</div>

<h2>Kadir</h2>

<script>
let puan = 0;
function puanArttir() {
  puan += 10;
  document.getElementById("puan").innerText = puan;
}
</script>

</body>
</html>
